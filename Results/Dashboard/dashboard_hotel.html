<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Analisis Ulasan Hotel</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #069494;
      color: white;
      padding: 18px 22px;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    header p {
      margin: 6px 0 0;
      opacity: 0.9;
      font-size: 13px;
    }

    .container {
      padding: 18px 22px;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr 2fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    select, input {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 14px;
      outline: none;
      background: white;
    }

    .stats {
      margin: 10px 0 18px;
      font-size: 13px;
      color: #555;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.07);
    }

    .card h3 {
      margin: 0 0 6px;
      font-size: 15px;
      line-height: 1.3;
    }

    .meta {
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
    }

    .img-wrap {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .img-wrap img {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #eee;
      background: #fafafa;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      margin-right: 6px;
      background: #eee;
      color: #333;
    }

    .bumn { background: #e8f7f7; color: #069494; }
    .kompetitor { background: #fff1e8; color: #B7410E; }

    footer {
      padding: 18px 22px;
      font-size: 12px;
      color: #777;
      text-align: center;
    }
  </style>
</head>

const filterTipe = document.getElementById("filterTipe");
const filterKelas = document.getElementById("filterKelas");
const searchHotel = document.getElementById("searchHotel");
const hotelGrid = document.getElementById("hotelGrid");
const stats = document.getElementById("stats");

function render() {
  const tipeVal = filterTipe.value;
  const kelasVal = filterKelas.value;
  const q = searchHotel.value.toLowerCase().trim();

  const filtered = hotelData.filter(h => {
    const okTipe = (tipeVal === "ALL") || (h.Tipe === tipeVal);
    const okKelas = (kelasVal === "ALL") || (h.Kelas === kelasVal);
    const okSearch = (q === "") || (h.Nama_Hotel.toLowerCase().includes(q));
    return okTipe && okKelas && okSearch;
  });

  stats.innerHTML = `Menampilkan <b>${filtered.length}</b> dari <b>${hotelData.length}</b> hotel`;

  hotelGrid.innerHTML = "";

  filtered.forEach(h => {
    const badgeClass = (h.Tipe === "BUMN") ? "bumn" : "kompetitor";

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <h3>${h.Nama_Hotel}</h3>
      <div class="meta">
        <span class="badge ${badgeClass}">${h.Tipe}</span>
        <span class="badge">${h.Kelas.replace("Bintang", "Bintang ")}</span>
      </div>

      <div class="img-wrap">
        <img src="${IMG_DIR}/${h.pie_file}" alt="Pie Chart Sentimen" />
        <img src="${IMG_DIR}/${h.map_file}" alt="Peta Masalah Negatif" />
      </div>
    `;

    hotelGrid.appendChild(card);
  });
}

filterTipe.addEventListener("change", render);
filterKelas.addEventListener("change", render);
searchHotel.addEventListener("input", render);

render();
